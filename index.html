<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作品集 · Portfolio</title>
<meta name="description" content="个人成果展示" />
<meta name="theme-color" content="#05070d" />
<link rel="canonical" href="https://zzj903.github.io/" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://zzj903.github.io/" />
<meta property="og:title" content="个人作品集" />
<meta property="og:description" content="个人成果展示" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230a0f1a'/%3E%3Cpath d='M28 68V32h12l20 24V32h12v36H60L40 44v24z' fill='%236f97ff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<!-- ===== 背景层 ===== -->
<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-noise"></div>
</div>
<div class="spotlight" id="spotlight" aria-hidden="true"></div>

<!-- ===== 导航 ===== -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text" id="brandText">Portfolio</span>
    </a>

    <nav class="nav-links" aria-label="主导航">
      <a href="#works">成果</a>
      <a href="#about">关于</a>
      <a href="#contact">联系</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ===== Hero ===== -->
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow reveal">
        <span class="dot"></span>
        <span id="heroRole">PORTFOLIO</span>
      </p>

      <h1 class="hero-title reveal" id="heroName">你的名字</h1>

      <p class="hero-tagline reveal" id="heroTagline">把想法做成能用的东西。</p>

      <div class="hero-actions reveal">
        <a class="btn btn-primary" href="#works">
          看作品
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <dl class="hero-stats reveal" id="heroStats">
        <div class="stat"><dt>收录成果</dt><dd id="statWorks">0</dd></div>
        <div class="stat"><dt>分类</dt><dd id="statCats">0</dd></div>
        <div class="stat"><dt>最近更新</dt><dd id="statUpdated">—</dd></div>
        <div class="stat stat--loc"><dt>坐标</dt><dd id="statLoc">—</dd></div>
      </dl>
    </div>
  </section>

  <!-- ===== 作品 ===== -->
  <section class="section" id="works">
    <div class="wrap">
      <div class="section-head">
        <div>
          <p class="section-index">01 / WORKS</p>
          <h2 class="section-title">成果</h2>
        </div>
        <p class="section-desc">按分类筛选，点击卡片查看详情或跳转。</p>
      </div>

      <div class="filters" id="filters" role="tablist" aria-label="分类筛选"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>这个分类下还没有内容。</p>
    </div>
  </section>

  <!-- ===== 关于 ===== -->
  <section class="section" id="about">
    <div class="wrap about">
      <div class="about-main">
        <p class="section-index">02 / ABOUT</p>
        <h2 class="section-title">关于</h2>
        <div class="about-text" id="aboutText"></div>
      </div>
      <aside class="about-side">
        <h3 class="mini-title">技能</h3>
        <ul class="skills" id="skills"></ul>
      </aside>
    </div>
  </section>

  <!-- ===== 联系 ===== -->
  <section class="section section--contact" id="contact">
    <div class="wrap contact">
      <p class="section-index">03 / CONTACT</p>
      <h2 class="contact-title">有想法，聊聊。</h2>
      <a class="mail" id="mailLink" href="mailto:hello@example.com"><span id="mailText">hello@example.com</span></a>
      <ul class="links" id="links"></ul>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span id="footerName">Portfolio</span>
    <span class="footer-dot">·</span>
    <span>Built with plain HTML · Hosted on GitHub Pages</span>
  </div>
</footer>


<script src="data/site.js"></script>
<script src="data/works.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
